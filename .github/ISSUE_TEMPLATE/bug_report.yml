name: Bug Report
description: Report a bug, Windows compatibility issue, Muse integration issue, or UI/UX defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **Security & Privacy Warning:** Never include passwords, API keys, authentication tokens, session cookies, or private Muse conversations in this report. Use **Diagnostics -> Copy Sanitized Report** instead.
  - type: input
    id: version
    attributes:
      label: Muse for Windows Version
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows Version & Architecture
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Windows 11 ARM64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      placeholder: "1. Launch Muse for Windows\n2. Navigate to ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Sanitized Logs
    validations:
      required: true
